[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
